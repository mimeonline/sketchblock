<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-context-title system-context-desc" viewBox="0 0 1072 616" data-diagram-engine="msys-diagram-engineering/2">
  <title id="system-context-title">Sketchblock · System context</title>
  <desc id="system-context-desc">Owners manage and save boards; invited participants collaborate. GitHub is optional for repository-backed boards.</desc>
  <style>
    .de-edge{fill:none;stroke:#65736e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .de-arrow{fill:#65736e}
    .de-node{stroke-width:1.5}
    .de-node-label{fill:#17221f;font:600 14px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-c4-name{fill:#17221f;font:700 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-c4-type{fill:#43524d;font:11px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-c4-description{fill:#33413d;font:12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-c4-detail{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .de-c4-database-body{stroke-width:1.5}
    .de-c4-title{fill:#17221f;font:700 20px ui-sans-serif,system-ui,sans-serif}
    .de-c4-boundary{fill:none;stroke:#315E7D;stroke-width:1.5;stroke-dasharray:8 6}
    .de-c4-boundary-label{fill:#315E7D;font:600 12px ui-sans-serif,system-ui,sans-serif}
    .de-c4-legend-title{fill:#17221f;font:600 12px ui-sans-serif,system-ui,sans-serif}
    .de-c4-legend-label{fill:#43524d;font:11px ui-sans-serif,system-ui,sans-serif}
    .de-flow-name{fill:#17221f;font:700 14px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-flow-description{fill:#43524d;font:11px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .de-deployment-node{fill:#f8faf9;stroke:#52605b;stroke-width:1.5}
    .de-deployment-face{fill:#eef2f0;stroke:#52605b;stroke-width:1.5}
    .de-edge-label{fill:#3d4a46;font:12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
  /* Shared presentation layer. Generated geometry and routing stay untouched. */
[id$="-canvas"] { fill: #f8fafb; stroke: #dce5e3; stroke-width: 1; }
.de-c4-title { fill: #183b35; font-weight: 650; letter-spacing: -.45px; }
.de-node, .de-c4-database-body { fill: #ffffff; stroke: #aabcb7; stroke-width: 1.25; }
.de-c4-detail { stroke: #aabcb7; }
.de-c4-name { fill: #183b35; font-weight: 650; }
.de-c4-type { fill: #566e67; }
.de-c4-description { fill: #344e46; }
.de-edge { stroke: #648179; stroke-width: 1.6; }
.de-arrow { fill: #648179; }
.de-edge-label { fill: #3d5e53; }
[data-visual-node="sketchblock"] .de-node,
[data-visual-node="web"] .de-node,
[data-visual-node="collab"] .de-node { fill: #123e35; stroke: #123e35; }
[data-visual-node="sketchblock"] .de-c4-name,
[data-visual-node="web"] .de-c4-name,
[data-visual-node="collab"] .de-c4-name { fill: #ffffff; }
[data-visual-node="sketchblock"] .de-c4-type,
[data-visual-node="web"] .de-c4-type,
[data-visual-node="collab"] .de-c4-type { fill: #a9dfcc; }
[data-visual-node="sketchblock"] .de-c4-description,
[data-visual-node="web"] .de-c4-description,
[data-visual-node="collab"] .de-c4-description { fill: #e0eee8; }
[data-visual-node="github"] .de-node { fill: #f0f3f5; stroke: #9aaab3; stroke-dasharray: 5 4; }
[data-role="human"] .de-node { fill: #eaf4ef; stroke: #87b5a1; }
[data-role="data"] .de-node,
[data-role="data"] .de-c4-database-body { fill: #edf2f5; stroke: #8b9da9; }
[data-role="data"] .de-c4-detail { stroke: #8b9da9; }
.de-c4-legend-title, .de-c4-legend-label { fill: #526961; }

  </style>
  <rect id="system-context-canvas" width="1072" height="616" rx="16" fill="#ffffff"/>
  <text id="system-context-visible-title" class="de-c4-title" x="32" y="36">Sketchblock · System context</text>
  <g id="system-context-edges" data-visual-role="edges">
    <path id="system-context-edge-owner-system" class="de-edge" d="M 272 208 H 406" data-from="owner:right" data-to="sketchblock:left"/>
    <polygon id="system-context-edge-owner-system-arrow" class="de-arrow" points="406,203 416,208 406,213"/>
    <path id="system-context-edge-guest-system" class="de-edge" d="M 272 416 H 304 V 272 H 406" data-from="guest:right" data-to="sketchblock:left"/>
    <polygon id="system-context-edge-guest-system-arrow" class="de-arrow" points="406,267 416,272 406,277"/>
    <path id="system-context-edge-system-github" class="de-edge" d="M 656 208 H 790" data-from="sketchblock:right" data-to="github:left"/>
    <polygon id="system-context-edge-system-github-arrow" class="de-arrow" points="790,203 800,208 790,213"/>
  </g>
  <g id="system-context-edge-labels" data-visual-role="edge-labels">
    <text id="system-context-label-owner-system-label" class="de-edge-label" x="344" y="192">Owns and saves</text>
    <text id="system-context-label-guest-system-label" class="de-edge-label" x="367" y="348">Collaborates</text>
    <text id="system-context-label-system-github-label" class="de-edge-label" x="728.5" y="175">OAuth / files<tspan x="728.5" dy="15">[HTTPS]</tspan></text>
  </g>
  <g id="system-context-nodes" data-visual-role="nodes">
    <g id="system-context-node-owner" data-visual-node="owner" data-role="human" data-c4-type="person" data-shape="box">
      <defs><clipPath id="system-context-node-owner-content-clip"><rect x="40" y="140" width="224" height="128" rx="6"/></clipPath></defs>
      <rect class="de-node" x="32" y="132" width="240" height="144" rx="10" fill="#E8F3EF" stroke="#296B5B"/>
      <g clip-path="url(#system-context-node-owner-content-clip)">
      <text class="de-c4-name" x="152" y="166">
        <tspan x="152" dy="0">Board owner</tspan>
      </text>
      <text class="de-c4-type" x="152" y="186">
        <tspan x="152" dy="0">[Person]</tspan>
      </text>
      <text class="de-c4-description" x="152" y="210">
        <tspan x="152" dy="0">Creates rooms and saves boards.</tspan>
      </text>
      </g>
    </g>
    <g id="system-context-node-guest" data-visual-node="guest" data-role="human" data-c4-type="person" data-shape="box">
      <defs><clipPath id="system-context-node-guest-content-clip"><rect x="40" y="348" width="224" height="128" rx="6"/></clipPath></defs>
      <rect class="de-node" x="32" y="340" width="240" height="144" rx="10" fill="#E8F3EF" stroke="#296B5B"/>
      <g clip-path="url(#system-context-node-guest-content-clip)">
      <text class="de-c4-name" x="152" y="374">
        <tspan x="152" dy="0">Invited participant</tspan>
      </text>
      <text class="de-c4-type" x="152" y="394">
        <tspan x="152" dy="0">[Person]</tspan>
      </text>
      <text class="de-c4-description" x="152" y="418">
        <tspan x="152" dy="0">Joins as collaborator or viewer.</tspan>
      </text>
      </g>
    </g>
    <g id="system-context-node-sketchblock" data-visual-node="sketchblock" data-role="system" data-c4-type="software-system" data-shape="box">
      <defs><clipPath id="system-context-node-sketchblock-content-clip"><rect x="424" y="140" width="224" height="128" rx="6"/></clipPath></defs>
      <rect class="de-node" x="416" y="132" width="240" height="144" rx="10" fill="#E8F0F7" stroke="#315E7D"/>
      <g clip-path="url(#system-context-node-sketchblock-content-clip)">
      <text class="de-c4-name" x="536" y="166">
        <tspan x="536" dy="0">Sketchblock</tspan>
      </text>
      <text class="de-c4-type" x="536" y="186">
        <tspan x="536" dy="0">[Software System]</tspan>
      </text>
      <text class="de-c4-description" x="536" y="210">
        <tspan x="536" dy="0">Shared Excalidraw editing and</tspan>
        <tspan x="536" dy="15">board management.</tspan>
      </text>
      </g>
    </g>
    <g id="system-context-node-github" data-visual-node="github" data-role="system" data-c4-type="software-system" data-shape="box">
      <defs><clipPath id="system-context-node-github-content-clip"><rect x="808" y="140" width="224" height="128" rx="6"/></clipPath></defs>
      <rect class="de-node" x="800" y="132" width="240" height="144" rx="10" fill="#E8F0F7" stroke="#315E7D"/>
      <g clip-path="url(#system-context-node-github-content-clip)">
      <text class="de-c4-name" x="920" y="166">
        <tspan x="920" dy="0">GitHub · optional</tspan>
      </text>
      <text class="de-c4-type" x="920" y="186">
        <tspan x="920" dy="0">[Software System]</tspan>
      </text>
      <text class="de-c4-description" x="920" y="210">
        <tspan x="920" dy="0">OAuth and repository-backed</tspan>
        <tspan x="920" dy="15">boards.</tspan>
      </text>
      </g>
    </g>
  </g>
  <g id="system-context-legend" data-visual-role="legend">
    <text class="de-c4-legend-title" x="32" y="586">Legend</text>
    <rect x="104" y="571" width="18" height="16" rx="3" fill="#E8F0F7" stroke="#315E7D"/>
    <text class="de-c4-legend-label" x="130" y="586">[person]</text>
    <rect x="252" y="571" width="18" height="16" rx="3" fill="#E8F0F7" stroke="#315E7D"/>
    <text class="de-c4-legend-label" x="278" y="586">[Software System]</text>
  </g>
</svg>
